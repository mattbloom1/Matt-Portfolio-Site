name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /Matt-Portfolio-Site
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    timeout-minutes: 25
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # A Pages deployment that hangs in "syncing_files" stays "in progress" on GitHub's side and every later
      # deployment is refused ("Please cancel <sha> first"). Deployment ids are commit shas, so cancel the recent ones and try again.
      - name: Cancel a stuck Pages deployment
        if: steps.deployment.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(gh api "repos/${GITHUB_REPOSITORY}/commits?sha=main&per_page=15" --jq '.[].sha'); do
            gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/deployments/${sha}/cancel" >/dev/null 2>&1 && echo "cancelled ${sha}" || true
          done
      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
