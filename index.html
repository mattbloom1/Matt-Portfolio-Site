<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Matt Bloomfield</title>
    <meta name="description" content="Portfolio of Matt Bloomfield: web and graphic design, work history, crafts, and photography." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <filter id="bleed" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n" />
        <feDisplacementMap id="bleed-disp" in="SourceGraphic" in2="n" scale="0" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div class="grain" aria-hidden="true"></div>
    <div class="bg" id="bg" aria-hidden="true"></div>
    <main id="stage" class="stage" data-state="opener">
      <div class="opener" id="opener">
        <div id="opener-stamp" class="opener-stamp"></div>
        <button class="skip" id="skip" type="button">Skip</button>
      </div>
      <nav id="stamps" class="stamps" aria-label="Sections"></nav>
      <button class="home" id="home" type="button" aria-label="Home" hidden></button>
      <section id="content" class="content" tabindex="-1" hidden></section>
      <div id="bleed-layer" class="bleed-layer" aria-hidden="true"></div>
    </main>
    <footer class="footer">
      <div class="foot-left"><span class="micro" id="micro-l"></span><span>Matt Bloomfield</span><a href="mailto:email@example.com" id="email">email@example.com</a></div>
      <div class="foot-right"><span class="micro" id="micro-r"></span><time id="clock"></time></div>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
